<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sudo-KO · Synthetic resilience simulation</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050d14;
        --panel: #0a121a;
        --raised: #0e1620;
        --line: #182227;
        --line2: #242e3a;
        --fg: #e8eef6;
        --muted: #8a96a4;
        --red: #f02d38;
        --red-text: #ff5a63;
        --red-bg: #2a0e14;
        --blue: #277dfd;
        --blue-text: #5b9dff;
        --blue-bg: #0d1f36;
        --green: #2bd47f;
        --green-bg: #0c2619;
        --amber: #e8b04f;
        --amber-bg: #2a1f0c;
        --grey: #a9b4c1;
        --team: var(--blue);
        --team-text: var(--blue-text);
        --team-bg: var(--blue-bg);
        --mono: "JetBrains Mono", ui-monospace, monospace;
        font: 14px/1.5 Inter, system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        color: var(--fg);
        background: var(--bg);
      }
      body[data-role="attacker"] {
        --team: var(--red);
        --team-text: var(--red-text);
        --team-bg: var(--red-bg);
      }
      body[data-role="observer"] {
        --team: #c2cad4;
        --team-text: #c2cad4;
        --team-bg: #141e28;
      }
      * {
        box-sizing: border-box;
        min-width: 0;
        scrollbar-color: #2b3645 var(--panel);
        scrollbar-width: thin;
      }
      html,
      body {
        height: 100%;
      }
      /* One-screen app shell on fixed grid tracks: only the inner panels scroll. */
      body {
        margin: 0;
        display: grid;
        grid-template-rows: 56px auto minmax(0, 1fr);
        height: 100dvh;
        overflow: hidden;
      }
      [hidden] {
        display: none !important;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid #a4d5ff;
        outline-offset: -2px;
      }
      h2 {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mono {
        font-family: var(--mono);
      }
      .muted {
        color: var(--muted);
      }
      .ellipsis {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        flex: none;
      }
      .dot.working {
        background: var(--blue-text);
        animation: blink 1.4s ease-in-out infinite;
      }
      .dot.failed {
        background: var(--amber);
      }
      .dot.done {
        background: var(--green);
      }
      .dot.paused {
        background: var(--grey);
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      /* Segmented control: a pill group used by the role switch, camera and log filter. */
      .seg {
        display: flex;
        flex: none;
        padding: 2px;
        gap: 2px;
        border-radius: 7px;
        background: var(--raised);
        border: 1px solid var(--line);
      }
      .seg button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 26px;
        padding: 0 10px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        white-space: nowrap;
      }
      .seg button[aria-pressed="true"] {
        color: var(--fg);
        background: #141e28;
        box-shadow: inset 0 0 0 1px #242e3a;
      }
      .seg .count {
        width: 28px;
        padding: 0;
        border-radius: 9px;
        font: 600 11px var(--mono);
        color: var(--amber);
        background: var(--amber-bg);
        text-align: center;
      }
      .seg .count:empty {
        visibility: hidden;
      }
      .tag {
        flex: none;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        padding: 2px 6px;
        border-radius: 4px;
        color: var(--grey);
        background: #141e28;
        white-space: nowrap;
      }
      .tag.red {
        color: var(--red-text);
        background: var(--red-bg);
      }
      .tag.blue {
        color: var(--blue-text);
        background: var(--blue-bg);
      }
      .tag.green {
        color: var(--green);
        background: var(--green-bg);
      }
      .tag.amber {
        color: var(--amber);
        background: var(--amber-bg);
      }
      /* 40px label bars used by every panel. */
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .bar .grow {
        flex: 1 1 0;
      }

      /* 1. Header: 56px, three fixed-role columns. */
      header {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 24px;
        height: 56px;
        padding: 0 16px 0 24px;
        border-bottom: 1px solid var(--line);
        background: #040b11;
      }
      .h-left {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .h-left b {
        font-size: 14px;
        letter-spacing: 0.22em;
      }
      .h-mid {
        display: grid;
        grid-template-rows: 20px 18px;
        align-content: center;
      }
      .h-mid .match {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 600;
      }
      .h-mid .sub {
        font-size: 12px;
        color: var(--muted);
      }
      .badge {
        flex: none;
        width: 92px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        padding: 2px 0;
        border-radius: 3px;
        border: 1px solid var(--line2);
        color: #c2cad4;
        background: #141e28;
        text-align: center;
      }
      .badge.red {
        color: var(--red-text);
        background: var(--red-bg);
        border-color: #6b2a35;
      }
      .h-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      #playback {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #play {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 5px;
        color: #c2cad4;
        background: var(--raised);
      }
      #timeline {
        width: 120px;
        accent-color: var(--team);
      }
      .pill {
        width: max-content;
        min-width: 64px;
        padding: 0 10px;
        white-space: nowrap;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid #7ee8b0;
        color: #7ee8b0;
        background: var(--green-bg);
        flex-shrink: 0;
      }
      .pill.stale {
        border-color: var(--amber);
        color: var(--amber);
        background: var(--amber-bg);
      }
      .pill.replay {
        border-color: var(--line2);
        color: var(--grey);
        background: #141e28;
      }
      .clock {
        width: 112px;
        display: grid;
        grid-template-rows: 20px 3px;
        gap: 3px;
      }
      #clock {
        font: 14px var(--mono);
        text-align: right;
        white-space: nowrap;
      }
      #clock span {
        color: #6f7b8a;
      }
      #reset-sandbox, #reset-swarm, #new-chat {
        font: 14px var(--mono);
        padding: 6px 12px;
        border: 1px solid var(--line2);
        border-radius: 4px;
        background: transparent;
        color: var(--fg);
      }
      #reset-sandbox:hover, #reset-swarm:hover, #new-chat:hover { background: var(--line2); }
      .progress {
        background: var(--line2);
        border-radius: 2px;
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--team);
      }
      #feedback { grid-row: 2; }
      #error:empty, #reset-status:empty {
        display: none;
      }
      #error, #reset-status {
        margin: 0;
        padding: 6px 24px;
        border-bottom: 1px solid var(--line);
        color: var(--amber);
        font-size: 13px;
      }

      header { grid-row: 1; }

      /* 2. Main row: rail | map | chat on fixed tracks. */
      main {
        grid-row: 3;
        display: grid;
        grid-template-columns: 288px minmax(0, 1fr) 360px;
        min-height: 0;
      }
      .rail {
        display: grid;
        grid-template-rows: 40px 96px auto 40px minmax(0, 1fr);
        overflow: hidden;
        min-height: 0;
        background: var(--panel);
        border-right: 1px solid var(--line);
      }
      body[data-resilience="true"] .rail {
        grid-template-rows: 40px auto auto 40px minmax(0, 1fr);
      }
      .resilience-metrics {
        grid-column: 1 / -1;
        grid-template-rows: none;
        gap: 5px;
        padding-block: 14px;
        font-variant-numeric: tabular-nums;
      }
      #rail-right {
        border-right: 0;
        border-left: 1px solid var(--line);
      }
      .gauge {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr);
        gap: 14px;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .ring {
        position: relative;
        width: 64px;
        height: 64px;
      }
      .ring svg {
        display: block;
        transform: rotate(-90deg);
      }
      .ring .pct {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 600 14px var(--mono);
      }
      .gauge-text {
        display: grid;
        grid-template-rows: 20px 18px;
      }
      .gauge-text b {
        font-size: 13px;
      }
      .gauge-text span {
        font-size: 12px;
        color: var(--muted);
      }
      .chipgrid {
        max-height: 112px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-auto-rows: 28px;
        gap: 6px;
        padding: 8px 16px;
        overflow: auto;
        border-bottom: 1px solid var(--line);
        align-content: start;
      }
      .chipgrid .none {
        grid-column: 1 / -1;
        font-size: 12px;
        color: var(--muted);
        line-height: 28px;
      }
      .chip {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 2px;
        padding: 0 5px;
        border-radius: 4px;
        font: 500 10px var(--mono);
        white-space: nowrap;
        background: var(--raised);
        border: 1px solid var(--line);
        text-align: left;
      }
      .chip span {
        color: var(--muted);
      }
      .chip[aria-pressed="true"] {
        border-color: var(--team);
        color: var(--team-text);
      }
      .empty-agents {
        padding: 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .empty-agents b { display: block; color: var(--fg); margin-bottom: 4px; }
      #provider { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cards {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow: auto;
        min-height: 0;
      }
      .agent {
        display: grid;
        grid-template-columns: 8px minmax(0, 1fr) auto;
        grid-template-rows: 18px 18px;
        column-gap: 10px;
        align-content: center;
        height: 56px;
        width: 100%;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        font-size: 12px;
      }
      .agent:hover {
        background: var(--raised);
      }
      .agent .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font: 500 13px var(--mono);
      }
      .agent .drone {
        font: 12px var(--mono);
        color: var(--muted);
        width: 56px;
        text-align: right;
      }
      .agent .doing {
        grid-column: 2 / -1;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 3. Map column. */
      .map {
        display: grid;
        grid-template-rows: 40px minmax(0, 1fr) clamp(160px, 24vh, 240px);
        min-height: 0;
      }
      #viewport {
        position: relative;
        overflow: hidden;
        background: #060f17;
        touch-action: none;
      }
      #viewport canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      .tip {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 1;
        pointer-events: none;
        padding: 2px 7px;
        border: 1px solid var(--line2);
        border-radius: 3px;
        background: rgba(5, 13, 20, 0.88);
        font: 11px var(--mono);
        white-space: nowrap;
      }
      #tip-hover {
        color: var(--muted);
      }
      /* Overlays sit on the map and never push layout. */
      .ov {
        position: absolute;
        z-index: 2;
        padding: 8px 10px;
        border: 1px solid #242e3a;
        border-radius: 6px;
        background: rgba(10, 18, 26, 0.9);
        font: 11px var(--mono);
        line-height: 18px;
        pointer-events: none;
      }
      .ov.tr {
        top: 12px;
        right: 12px;
        width: 260px;
        pointer-events: auto;
      }
      .ov.bl {
        left: 12px;
        bottom: 12px;
      }
      .ov.br {
        right: 12px;
        bottom: 12px;
      }
      .ov .head {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 22px;
      }
      .ov .head b {
        font-size: 13px;
      }
      .ov .head button {
        margin-left: auto;
        width: 22px;
        height: 22px;
        font-size: 16px;
        color: var(--muted);
      }
      .ov .line {
        margin-top: 4px;
        font: 12px Inter, system-ui, sans-serif;
        color: #c2cad4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .key {
        display: grid;
        grid-template-columns: auto auto;
        column-gap: 14px;
      }
      .key span:nth-child(odd) {
        color: var(--fg);
      }
      .key span:nth-child(even) {
        color: var(--muted);
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      .legend i {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .legend i.ring-key {
        border: 1.5px solid var(--amber);
      }
      .legend i.ghost {
        border: 1.5px solid #8a96a4;
        box-shadow: 6px 0 0 -2.5px var(--amber);
      }
      .legend i.iso {
        border: 1.5px dashed #c2cad4;
      }
      #cam button {
        width: 92px;
      }

      /* 4. Bounded activity log; rows scroll inside the workspace. */
      .log {
        display: grid;
        grid-template-rows: 40px minmax(0, 1fr);
        border-top: 1px solid var(--line);
        background: var(--bg);
      }
      #only-sel {
        width: 112px;
        height: 26px;
        border-radius: 5px;
        font: 500 11px var(--mono);
        color: var(--amber);
        border: 1px solid var(--line2);
        visibility: hidden;
      }
      #only-sel[aria-pressed="true"] {
        background: var(--amber-bg);
      }
      .rows {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow: auto;
        min-height: 0;
      }
      .row {
        display: grid;
        grid-template-columns: 84px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        height: 34px;
        width: 100%;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        text-align: left;
        cursor: pointer;
      }
      .row:hover,
      .row[aria-selected="true"] {
        background: var(--raised);
      }
      .row .t {
        font: 11px var(--mono);
        color: var(--muted);
      }
      .row .s {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #c2cad4;
      }
      .row b {
        font-weight: 600;
      }
      .c-red {
        color: var(--red-text);
      }
      .c-blue {
        color: var(--blue-text);
      }
      .c-amber {
        color: var(--amber);
      }
      .c-grey {
        color: var(--grey);
      }
      .c-white {
        color: var(--fg);
      }
      .c-team {
        color: var(--team-text);
      }

      /* 5. Chat: conversation only. */
      #chat {
        display: grid;
        grid-template-rows: 40px minmax(0, 1fr) 40px 48px;
        min-height: 0;
      }
      #chat-sub {
        margin-left: auto;
        font-size: 12px;
        color: var(--team-text);
        white-space: nowrap;
        flex-shrink: 0;
      }
      #chat > .bar > div { min-width: 0; flex: 1; }
      #transcript {
        overflow: auto;
        padding: 12px 12px 4px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
      }
      .bubble {
        max-width: 86%;
        padding: 7px 10px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.45;
        color: #d4dce5;
        background: var(--raised);
        align-self: flex-start;
        border-bottom-left-radius: 3px;
        overflow-wrap: anywhere;
      }
      .bubble.you {
        align-self: flex-end;
        background: var(--team-bg);
        border-bottom-left-radius: 10px;
        border-bottom-right-radius: 3px;
      }
      .bubble .queued {
        display: block;
        font: 11px var(--mono);
        color: var(--amber);
      }
      .bubble.typing {
        color: var(--muted);
        font-style: italic;
      }
      .bubble.hint {
        align-self: stretch;
        max-width: none;
        background: none;
        color: var(--muted);
        text-align: center;
        font-size: 12px;
      }
      .interaction { display: flex; flex-direction: column; gap: 8px; }
      .interaction > div { min-width: 0; }
      .interaction > .bubble.you { align-self: flex-end; }
      .interaction-progress { color: var(--team-text); font-size: 12px; padding: 2px 10px; }
      .interaction .bubble { max-width: 100%; }
      .interaction p { margin: 0; }
      .interaction p + p, .interaction ul { margin-top: 6px; }
      .interaction ul { margin-bottom: 0; padding-left: 16px; }
      .interaction li + li { margin-top: 5px; }
      .outcome b { display: block; margin-bottom: 4px; }
      .evidence { display: block; font-size: 11px; color: var(--muted); margin-top: 6px; }
      details { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
      summary { cursor: pointer; padding: 5px 0; }
      details pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.5 var(--mono); color: #c2cad4; }
      #context-slot {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 12px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      #context-slot .chip {
        height: 26px;
        grid-template-columns: auto auto auto;
        gap: 8px;
        color: var(--team-text);
        border-color: var(--team);
      }
      #context-slot .chip button {
        color: var(--muted);
        font-size: 14px;
      }
      .compose {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 48px;
        height: 48px;
        margin: 0;
        border-top: 1px solid var(--line);
      }
      #say {
        height: 100%;
        padding: 0 16px;
        background: var(--bg);
        border: 0;
        font-size: 13px;
      }
      #send {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--team);
        color: #fff;
      }

      /* Agent detail modal. */
      #modal {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(2, 6, 10, 0.7);
      }
      .dialog {
        width: 440px;
        max-width: calc(100vw - 32px);
        border: 1px solid var(--line2);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
        max-height: calc(100dvh - 32px);
        overflow: auto;
        overscroll-behavior: contain;
        overflow-wrap: anywhere;
      }
      .dialog .head {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: var(--panel);
        z-index: 1;
      }
      .dialog .head .name {
        font: 600 14px var(--mono);
        min-width: 0;
      }
      .dialog .head button {
        margin-left: auto;
        width: 28px;
        height: 28px;
        font-size: 18px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .dialog p {
        margin: 0;
        padding: 12px 16px;
        font-size: 13px;
        color: #c2cad4;
        min-height: 44px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .stats div {
        display: grid;
        grid-template-rows: 16px 24px;
        padding: 8px 16px;
        border-right: 1px solid var(--line);
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .stats div:last-child {
        border-right: 0;
      }
      .stats b {
        font: 18px var(--mono);
        color: var(--fg);
        text-transform: none;
        letter-spacing: 0;
      }
      .dialog .rows {
        height: auto;
        overflow: visible;
      }
      #modal-specialty { padding-bottom: 4px; color: var(--team-text); }
      #modal-target, #modal-details { padding: 8px 16px; }
      #modal-current { color: var(--muted); font-size: 12px; }
      .dialog h3 { font-size: 12px; margin: 12px 16px 4px; }
      .row .t { white-space: nowrap; font-variant-numeric: tabular-nums; }
      .dialog .row { grid-template-columns: 84px minmax(0, 1fr); }
      .dialog .row {
        cursor: default;
        height: auto;
        min-height: 34px;
        padding-block: 8px;
        align-items: start;
      }
      .dialog .row .s { white-space: normal; overflow-wrap: anywhere; }

      @media (min-width: 901px) and (max-width: 1350px) {
        main { grid-template-columns: 240px minmax(0, 1fr) 300px; }
        header { padding-inline: 12px; gap: 12px; }
        .h-left { gap: 10px; }
        #cam button { width: 68px; }
      }
      /* Small screens stack; laptop workspaces retain their full-height columns. */
      @media (max-width: 900px) {
        body {
          display: block;
          height: auto;
          overflow: auto;
        }
        header {
          grid-template-columns: auto minmax(0, 1fr);
          grid-auto-rows: auto;
          height: auto;
          padding: 8px 16px;
          gap: 8px 16px;
        }
        .h-left { grid-column: 1 / -1; flex-wrap: wrap; }
        .h-right { grid-column: 1 / -1; flex-wrap: wrap; }
        main {
          display: block;
        }
        .rail,
        #rail-right {
          border-left: 0;
          border-right: 0;
          border-top: 1px solid var(--line);
        }
        .rail { grid-template-rows: 40px 96px 112px 40px 280px; }
        body[data-resilience="true"] .rail { grid-template-rows: 40px auto auto 40px 280px; }
        .map {
          grid-template-rows: 40px 360px 300px;
        }
        #chat {
          grid-template-rows: 40px 280px 40px 48px;
        }
        .ov.bl {
          display: none;
        }
        footer summary {
          white-space: normal;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot.working {
          animation: none;
        }
      }
    </style>
  </head>
  <body data-role="defender">
    <header>
      <div class="h-left">
        <b>SUDOKO</b>
        <nav class="seg" aria-label="Role view">
          <button data-role="attacker" aria-pressed="false">
            <span class="dot" style="background: #f02d38"></span>Challenge
          </button>
          <button data-role="defender" aria-pressed="true">
            <span class="dot" style="background: #277dfd"></span>Defense
          </button>
          <button data-role="observer" aria-pressed="false">
            <span class="dot" style="background: #c2cad4"></span>Observer
          </button>
        </nav>
      </div>
      <div class="h-mid">
        <div class="match">
          <span id="match" class="ellipsis">Blue team · FC-01</span>
          <span class="badge" id="badge">—</span>
        </div>
        <span id="context" class="sub ellipsis"></span>
      </div>
      <div class="h-right">
        <div id="playback">
          <button id="play" aria-label="Play recording">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M6 4l14 8-14 8z" />
            </svg>
          </button>
          <input id="timeline" type="range" min="0" max="1" value="0" aria-label="Scrub recording" />
        </div>
        <span class="pill replay" id="live" role="status" title="Loading…">Connecting</span>
        <button id="reset-swarm" type="button" title="Restore the shared fleet and stop agents; keep conversations" hidden>Reset Swarm</button>
        <button id="reset-sandbox" type="button" title="Reset the shared fleet and both conversations" hidden>Reset Demo</button>
        <div class="clock">
          <div id="clock">0:00<span>&nbsp;/ 1:00</span></div>
          <div class="progress"><i id="progress"></i></div>
        </div>
      </div>
    </header>
    <div id="feedback">
      <p id="error" role="status"></p>
      <p id="reset-status" role="status" aria-live="polite"></p>
    </div>
    <main>
      <aside id="rail-left" class="rail" aria-label="Agents"></aside>
      <section class="map" aria-label="Drone swarm map">
        <div class="bar">
          <h2 id="map-title"></h2>
          <span class="grow"></span>
          <div class="seg" id="cam" aria-label="Camera">
            <button id="reframe" title="Reframe the fleet (double-click the map)">Fit</button>
            <button id="camera" aria-pressed="false">Top-down</button>
          </div>
        </div>
        <div id="viewport">
          <div class="tip" id="tip-sel" hidden></div>
          <div class="tip" id="tip-hover" hidden></div>
          <div class="ov tr" id="ov-sel" hidden></div>
          <div class="ov bl key" aria-label="Map controls">
            <span>Drag</span><span>Orbit</span>
            <span>Right-drag</span><span>Pan</span>
            <span>Scroll</span><span>Zoom</span>
            <span>Double-click</span><span>Reframe</span>
          </div>
          <div class="ov br legend" id="legend"></div>
        </div>
        <section class="log" aria-label="Activity log">
          <div class="bar">
            <h2>Activity</h2>
            <div class="seg" id="filter" aria-label="Log filter">
              <button data-filter="all" aria-pressed="true">All</button>
              <button data-filter="problems" aria-pressed="false">Problems<span class="count" id="problems"></span></button>
              <button data-filter="you" aria-pressed="false">You</button>
            </div>
            <span class="grow"></span>
            <button id="only-sel" aria-pressed="false">Only DR-000</button>
          </div>
          <ul class="rows" id="log"></ul>
        </section>
      </section>
      <aside id="rail-right" class="rail" aria-label="Right column" hidden></aside>
      <aside id="chat" aria-label="Chat">
        <div class="bar">
          <div><h2 id="chat-name">Sentinel</h2><div id="provider"></div></div>
          <span id="chat-sub"></span>
          <button id="new-chat" type="button" title="Start a fresh conversation for this role; keep the fleet" hidden>New Chat</button>
        </div>
        <div id="transcript" role="log" aria-live="polite"></div>
        <div id="context-slot"></div>
        <form class="compose" id="compose">
          <input id="say" aria-label="Message agent" autocomplete="off" />
          <button id="send" type="submit" aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </form>
      </aside>
    </main>
    <div id="modal" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-name">
        <div class="head">
          <span class="dot" id="modal-dot"></span>
          <span class="name" id="modal-name"></span>
          <span class="tag" id="modal-state"></span>
          <button id="modal-close" aria-label="Close agent inspector">×</button>
        </div>
        <p id="modal-specialty"></p>
        <div id="modal-target"></div>
        <p id="modal-text"></p>
        <p id="modal-result"></p>
        <p id="modal-current"></p>
        <h3>Activity</h3>
        <ul class="rows" id="modal-log"></ul>
        <div id="modal-details"></div>
      </div>
    </div>
    <script type="module" src="/fleet.js"></script>
  </body>
</html>
